        }

        .organic-circle::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: 3px solid #ff67676b;
            border-radius: 66% 34% 51% 49% / 54% 45% 55% 46%;
        }

        .scoreItemWrapper {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            margin: 1rem auto 4rem auto;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            align-content: center;
            place-items: center;
            grid-row-gap: 5px;
        }

        .topWrapper {

            display: flex;
            flex-direction: row;
            justify-content: space-around;

            box-sizing: border-box;

        .topInnerWrapper {

            flex-direction: row;
            justify-content: space-around;
            height: min-content;
            align-items: center;
        }

        .select {
            font-size: 1.2rem;
            border: none;
            appearance: none;
        }

        .tail {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: row;
            background: white;
        }

        .resetBtn {

            color: black;
            font-size: 2rem;
            border: thin solid rgba(0, 0, 0, 0.1);

            color: white;
            font-size: 2rem;
            border: thin solid rgba(0, 0, 0, 0.1);

            padding: 0.5rem;
            border-radius: 10px;

        }

            color: black;
            border: none;
            padding: 0.5rem;
            width: 50%;
        }

        .activeScoreType {
            background: dodgerblue;
            color: white;
            border: none;
            padding: 0.5rem;
            width: 50%;
        }

        .inputCard {
            z-index: 999;
            background-color: white;
            position: fixed;
            width: 90%;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 2px 2px 5px silver;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .inputCard div {
            margin: 0.5rem 0;
        }

        .panelOuterWrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 2px 2px 5px silver;
            padding: 1rem;
            border-radius: 10px;
            position: fixed;
            top: 0;
            left: 0;
            background: white;
            z-index: 1000;
        }

        .panelWrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: center;
            position: relative;
            height: 100%;
            box-sizing: border-box;
            margin: 0 auto;

            color: black;
            font-size: 2rem;
            position: absolute;
            right: 0;
            top: 0;
            width: 2rem;
            height: 2rem;

                            {{ele}}
                    </div>
                <div class="aaa">：</div>
                <div class="bbb">{{yi}}</div>
              </div>
              `,
        watch: {
            pin: {
                handler(newer, older) {
                    // let res = []
                    // for (let i = 0; i < this.text.length; i++){

                    this.pinyins = newer;

                deep: true,
                immediate: true
            }
        },
        methods: {
            updatePinyin(newer) {
                console.log("here", newer)
                this.pinyins = newer;
                this.$forceUpdate();
            }
        }
    });

    <div id="app">
        <div style="position: sticky; top: 0; width: 100%; background: white; box-shadow: 2px 2px 5px silver;">
            <div class="topWrapper">
                <select class="select" v-model="currentClass" @change="classChange">
                    <option :value="ele.val" v-for="ele in classes">{{ele.title}}</option>
                </select>
                <img src="https://s21.ax1x.com/2025/05/28/pVptO5q.png" alt="pVptO5q.png" style="width: 1.5rem;height: 1.5rem;" />
                <select class="select" v-model="currentClassMate" @change="classmateChange">
                    <option :value="ele" v-for="ele in classmates[currentClass]">{{ele}}</option>
                </select>
                <div>总分：<span @click="showInputCard">{{totalScore}}</span></div>
                <!-- <button @click="modifyTotalScore">修改</button> -->
                <div>
                    得分：
                    <input type="number" class="input" v-model="actualScore" style="width: 2rem;color: red;" disabled />
                </div>
            </div>
            <div class="topWrapper">
                <button :class="[scoreType === 1 ? 'activeScoreType' : 'primaryScoreType']" @click="scoreTypeClick(1)">+
                    加分</button>
                <button :class="[scoreType === -1 ? 'activeScoreType' : 'primaryScoreType']" @click="scoreTypeClick(-1)">- 减分</button>
            </div>
        </div>
        <div class="scoreItemWrapper">
            <button :class="[((scoreType === 1 && actualScore + ele <= totalScore) || (scoreType === -1 && actualScore + ele >= 0))? 'scoreItemActive' : 'scoreItem']" v-for="ele in scores" @click="calculate(ele)" :disable="scoreType === 1 ? actualScore + ele > totalScore : actualScore + ele < 0">{{ele}}</button>
        </div>
        <div class="panelOuterWrapper" v-if="showRecord">
            <div class="panelWrapper">
                <div class="closeBtn" @click="hideRecordPanel">×</div>
                <div style="align-self: flex-start; width: 100%; box-sizing: border-box; padding: 1rem; color: black;">

                <div style="height: 100%; width: 100%; overflow-y: scroll;">
                    <div v-for="score in scoreRecord" style="margin: 0.5rem 0;">

                    </div>
                </div>
            </div>
        </div>
        <div class="tail">

            <button @click="exportAs" class="helpBtn">导出</button>
            <button @click="reset" class="resetBtn">重置</button>
            <button @click="submit" class="submitBtn">提交</button>
        </div>
        <div>
            <table style="border: 0px solid #0094ff;" v-for="(ele, key) in groupedScoreList" ref="table_k" :data-k="key" v-show="false">

                    <td style="border: 0px solid #0094ff;text-align: right">{{inner.score}}</td>
                </tr>
            </table>

        },

                for (const item of this.scoreList) {
                    if (groupedBy[item.className]) {

                    } else {

                    }
                }
                this.groupedScoreList = groupedBy;

                this.$nextTick(() => {

                this.currentClassMate = this.classmates[this.currentClass][0];
            },
            hideRecordPanel() {
                this.showRecord = false;
            },
            showRecordPanel() {
                this.showRecord = true;
            },
            showInputCard() {
                this.showCard = true;
            },
            confirmTotalScore() {
                if (this.inputModel >= 0 && this.inputModel <= 100) {
                    this.totalScore = this.inputModel;
                    if (this.scoreType === 1) {
                        this.actualScore = 0;
                    } else {
                        this.actualScore = this.totalScore;
                    }
                    this.modifyTotalScore();
                    this.showCard = false;
                } else {
                    alert("分值需要0-100")
                }
            },
            scoreTypeClick(val) {
                this.scoreType = val;
                if (this.scoreType === 1) {
                    this.actualScore = 0;
                } else {
                    this.actualScore = this.totalScore;
                }
                this.modifyTotalScore();
            },
            reset() {
                if (this.scoreType === 1) {
                    this.actualScore = 0;
                } else {
                    this.actualScore = this.totalScore;
                }
                this.modifyTotalScore();
            },
            submit() {
                this.scoreList.push({
                    className: this.currentClass,
                    classmate: this.currentClassMate,
                    score: this.actualScore
                });
                if (this.scoreType === 1) {
                    this.actualScore = 0;
                } else {
                    this.actualScore = this.totalScore;
                }
                if (this.currentClassMateIndex < this.classmates[this.currentClass].length - 1) {
                    this.currentClassMateIndex += 1;
                    this.currentClassMate = this.classmates[this.currentClass][this.currentClassMateIndex];
                }
                this.modifyTotalScore();
            },
            calculate(e) {
                if (this.actualScore + e >= 0 && this.actualScore + e <= this.totalScore) {
                    this.actualScore += e;
                    this.scoreRecord.push(e)
                }
            },
            scoreTypeChange(param) {
                this.modifyTotalScore();
            },
            totalScoreChanged(param) {
                console.log(param)
            },
            modifyTotalScore(param) {
                let array = []
                for (let i = 0.5; i <= this.totalScore; i += 0.5) {
                    array.push(i * this.scoreType);
                }
                this.scores = array;
            },
            remove(idx) {
                this.sens.splice(idx, 1);
            },
            insertBefore(idx) {
                this.sens.splice(idx, 0, {
                    "text": '',
                    "pinyin": {},
                    "yi": "",
                    "point": false
                });
            },
            insertAfter(idx) {
                this.sens.splice(idx + 1, 0, {
                    "text": '',
                    "pinyin": {},
                    "yi": "",
                    "point": false
                });
            },
            handleMe() {
                // console.log("ele")
                this.current = ele;
            },
            hi(ele, idx) {
                this.currentRow = idx;
                this.currentCols = ele;
                this.currentPinyin = {
                    "0": ''
                };
                this.current = this.sens[idx]["text"][ele]
            },
            append(ele) {
                this.currentPinyin["0"] = this.currentPinyin["0"] + ele;
                let old = this.sens[this.currentRow];
                old["pinyin"][this.currentCols] = this.currentPinyin["0"];

                this.$set(this.sens, this.currentRow, old);
                console.log(this.sens)
                this.$refs[`son_${this.currentRow}`][0].updatePinyin(old["pinyin"])
            }
        }
